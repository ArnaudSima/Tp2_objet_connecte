# .github/workflows/deploy.yml
name: Deploy Backend
 
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone le repo 
        uses: actions/checkout@v3

      - name: Login Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: rasberryregistre.azurecr.io
          username: ${{ secrets.REGISTRYUSERNAME }}
          password: ${{ secrets.REGISTRYPASSWORD }}

      - name: Build & Push
        run: | 
          docker build -f serveur/Dockerfile ./serveur \
            -t rasberryregistre.azurecr.io/serveur:latest
          docker push rasberryregistre.azurecr.io/serveur:latest
          
      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
    
      - name: Deploy sur Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp update \
              --name tp2objetconnecte  \
              --resource-group rasberryPI-IOT \
              --image rasberryregistre.azurecr.io/serveur:latest
